lute;width:300px;height:300px;border-radius:50%;border:1px solid #ffffff17;right:-45px;top:-140px;box-shadow:0 0 0 30px #ffffff08,0 0 0 65px #ffffff05}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mint);font-weight:700}.hero h1{font:800 clamp(26px,4vw,42px) Manrope;margin:14px 0 10px;letter-spacing:-1.5px;max-width:680px}.hero p{color:#b9c5d4;max-width:610px;line-height:1.65;margin:0}.progressrow{display:flex;gap:16px;align-items:center;margin-top:24px;font-size:11px;color:#c3cede}.track{width:160px;height:5px;background:#ffffff24;border-radius:9px;overflow:hidden}.track i{display:block;width:20%;height:100%;background:var(--mint);transition:.3s}.content{padding-top:30px;animation:fade .3s ease}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.sectionhead h2{font:700 20px Manrope;margin:0}.sectionhead span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:21px 23px;box-shadow:0 4px 20px #273c5806;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card h3{font:700 14px Manrope;margin:0 0 12px;display:flex;gap:9px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}.card p,.card li{font-size:13px;line-height:1.65;color:#526178}.card p{margin:7px 0}.card ul,.card ol{padding-left:19px;margin:8px 0}.card li{padding:2px 0}.full{grid-column:1/-1}.callout{background:#eef4ff;border-left:3px solid var(--blue);padding:12px 15px;border-radius:0 10px 10px 0;color:#36496c;font-size:12px;line-height:1.6;margin-top:12px}.tablewrap{overflow:auto}.compare{border-collapse:collapse;width:100%;font-size:12px}.compare th{text-align:left;color:#68768c;background:#f6f8fb;font-weight:600}.compare td,.compare th{padding:11px;border-bottom:1px solid var(--line);vertical-align:top}.compare td{color:#526178}.q{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:8px 0;color:#485971;font-size:13px;background:#fbfcfe}.footer{padding:28px 4px;color:#8a97a9;font-size:11px;text-align:center}.mobilemenu{display:none}
.definition{background:#f7f9fd;border:1px solid #e9eef6;border-radius:10px;padding:10px 13px;margin:10px 0 12px}.definition b{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#5379f6}.definition p{margin:4px 0 0;color:#35445c}.fullform{font-size:11px;color:#71809a;font-weight:500}.readlist{padding-left:20px!important;margin:10px 0!important}.readlist li{padding:4px 0 4px 3px!important}.example{display:inline-block;background:#eef4ff;color:#3c5794;padding:2px 7px;border-radius:6px;font-weight:600}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{height:auto;position:relative;padding:15px;display:block}.brand{padding:0 6px 12px}.navlabel,.sidefoot{display:none}.tabs{display:flex;overflow:auto}.tab{white-space:nowrap;padding:10px 12px}.tab:hover{transform:none}.main{padding:24px 18px 50px}.hero{padding:28px 24px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{margin-bottom:20px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><div class="brandmark">S</div><div><strong>Secure Systems</strong><small>EXAM STUDY HUB</small></div></div><div class="navlabel">Your syllabus</div><nav class="tabs" id="tabs"></nav><div class="sidefoot">Advanced System Security Topics<br>University of Colorado · Coursera</div></aside><main class="main"><div class="top"><div class="crumb">Study hub <span> / </span> <b id="crumb">Module 1</b></div><div class="pill">✦ Focus mode · Notes + review</div></div><section class="hero"><div class="eyebrow" id="eyebrow">MODULE 01 · FOUNDATIONS</div><h1 id="title"></h1><p id="subtitle"></p><div class="progressrow"><span id="counter"></span><div class="track"><i id="progress"></i></div><span>5 modules</span></div></section><section class="content" id="content"></section><div class="footer">Built for focused revision · Select a module to explore</div></main></div>
<script>
const modules=[
{short:'Access Control Basics',tag:'FOUNDATIONS',title:'Introduction to Access Control',sub:'Understand the purpose, core concepts, and principles behind controlling access to systems and information.',sections:[
['What is access control?','Access control is the process of deciding which subjects can perform which actions on which resources, and under what conditions.','Subject: an active entity requesting access, such as a user, process, or device. Object/resource: something being accessed, such as a file, database, application, or network service. Action: an operation such as read, write, execute, delete, or modify. Policy: rules used to decide whether a request is allowed. Environment/context: conditions such as time, location, or device.','Example: a student requests to read a course file; policy may allow it only if enrolled and signed in.'],
['Purpose of access control','Access control prevents unauthorized access and misuse, limits users to the information and operations they need, protects confidentiality, integrity, and availability, enforces organizational or legal requirements, and makes decisions consistent and auditable.','Least privilege means giving each subject only the permissions needed for its legitimate task, and only for as long as needed.'],
['Authentication, authorization, auditing','Authentication establishes who or what is making a request. Authorization decides what that authenticated subject may do. Auditing records access and actions for later review.','Memory aid: Authentication = Who are you? Authorization = What may you do? Auditing = What happened?','Example: password plus one-time code authenticates; permission to view but not edit authorizes; change logs provide audit evidence.'],
['Access-control decision flow','A subject requests an action on a resource; the system identifies the subject and gathers information; checks the policy; grants or denies the request; and may record the decision and action in an audit log.'],
['Core security principles','Least privilege: minimize permissions. Separation of duties: split sensitive tasks so one person cannot complete a risky process alone. Need to know: provide only information required for a responsibility. Default deny: deny unless policy explicitly permits. Complete mediation: check access each time a protected resource is requested.'],
['Access-control models','RBAC assigns permissions to roles and users to roles. Example: a teaching assistant role can view submissions and enter grades. ABAC evaluates attributes of the subject, resource, action, and context. Example: allow if department matches and request comes from an approved device. RBAC is often simpler for stable job roles; ABAC expresses more detailed, context-sensitive rules.'],
['Identification vs authentication','Identification is claiming an identity; authentication is proving that claim. Entering a username identifies the claimed account; providing a valid password or security key helps authenticate it.'],['Exam-ready summary','Access control governs which subjects may perform which actions on which resources according to policy. Authentication verifies identity; authorization evaluates permissions; auditing records activity. Important principles are least privilege, separation of duties, need to know, default deny, and complete mediation.'] ],questions:['Explain the difference between authentication and authorization.','Identify the subject, resource, and action in a user downloading a report.','What does least privilege mean, and why is it useful?','How does default deny improve security?','Give one situation where ABAC may be more suitable than RBAC.']},
{short:'Policies, Models & Mechanisms',tag:'ACCESS CONTROL',title:'Policies, Models & Mechanisms',sub:'Separate the rules, frameworks, and enforcement tools; compare DAC and MAC, ACLs, and capabilities.',sections:[
['Policy, model, mechanism','Policy states who may do what, to which resource, and under what conditions (e.g. only instructors may edit grades). Model structures the rules, such as DAC, MAC, RBAC, or ABAC. Mechanism enforces them, such as an ACL or capability list.'],
['Discretionary Access Control (DAC)','The owner or controller of a resource decides who gets access and what permissions they receive. Example: a file owner grants another user read or write access. Advantages: flexible, convenient sharing, owner-managed. Limitations: permissions can spread beyond intent; users may grant too broadly; organization-wide policy is harder to enforce; malware with user permissions may access their files.'],
['Non-discretionary access control','Individual resource owners do not freely decide access; a central authority or system-wide policy controls decisions. Examples include MAC (labels and clearances), RBAC (organizational roles), and ABAC (subject, resource, action, and context attributes). It can provide more consistent central management than DAC.'],
['Mandatory Access Control (MAC)','The system enforces centrally defined rules, often using security labels. A subject has a clearance; a resource has a classification; the system compares them. Example: Confidential clearance cannot access Secret documents. Bell–LaPadula confidentiality rules include No read up and No write down, helping prevent sensitive data flowing downward. Strength: strong centralized enforcement. Limits: less flexible; labels and rules are difficult to administer and must be maintained carefully.'],
['Access-Control List (ACL)','An ACL is attached to an object and lists subjects or groups with allowed operations. Example: Alice—read/write; Bob—read; Guest—no access. On request, system checks the object ACL. Strengths: easy to see who can access an object; convenient object-by-object management; common in file systems. Limits: hard to answer what a user can access across many objects; lists grow complex; user permission changes may require many updates; stale entries preserve excessive access.'],
['Capability list','A capability is a protected token identifying an object and permitted operations. A capability list groups the capabilities held by a subject. Example: Alice—File A read/write; Printer 1 print. The subject presents a valid capability. Strengths: easy to determine what a subject can access; delegation may be supported; avoids searching every object ACL. Limits: revocation is difficult if copies were distributed; tokens must be protected against forgery/theft/copying; delegation obscures how access spread.'],
['ACL vs capability list','ACL is associated with the object and lists subjects/permissions; it naturally answers “Who can access this object?” Capability list is associated with the subject and lists objects/operations; it answers “What can this subject access?” Both enforce access; practical security depends on permission changes, revocation, delegation, and protection against misuse.'],
['Exam-ready summary','A policy states rules, a model organizes them, and a mechanism enforces them. DAC relies on resource-owner discretion; MAC on centrally enforced policy and labels. ACLs attach to objects and list subjects with permissions; capability lists attach to subjects and list objects and allowed operations.'] ],questions:['Distinguish policy, model, and mechanism.','Compare DAC with MAC.','What information does an ACL store, and where is it associated?','What does a capability specify, and how does it differ from an ACL entry?','Give one limitation of each mechanism.','Why can capability revocation be difficult?']},
{short:'Role-Based Access Control',tag:'RBAC',title:'Role-Based Access Control',sub:'Learn core RBAC, hierarchy and constraints, then compare RBAC with DAC and MAC and see enterprise applications.',sections:[
['What is RBAC?','RBAC manages permissions through organizational roles: permissions are assigned to roles, users are assigned to roles, and users receive permissions through those roles. Example: Nurse role can view patient records and update vital signs.'],
['Core RBAC','Four elements: users (people or system identities), roles (job functions), permissions (approved operations on resources), sessions (active interaction where a user activates assigned roles). A user can have several roles but activate only those needed for a session. Example: staff member activates Researcher, not Department Manager, while working with research data.'],
['Role hierarchy','A senior role inherits permissions from subordinate roles. Example: Employee can view internal documents; Team Lead inherits those and approves leave; Department Head inherits Team Lead and approves budgets. Hierarchy simplifies administration, but should model permission inheritance rather than just job titles; excessive inheritance creates excess privilege.'],
['Static and dynamic constraints','Static separation of duties limits which roles a user can be assigned simultaneously: e.g. cannot hold Payment Requester and Payment Approver. Dynamic separation of duties allows holding both roles but prevents activating them together in one session. This helps prevent one person completing conflicting steps.'],
['Limitations of RBAC','Role explosion from combinations of job, project, location, seniority; coarse permissions may exceed task needs; basic RBAC does not naturally express context like managed device or work hours; roles need maintenance when jobs change; hierarchy may spread sensitive permissions unintentionally; role mining is difficult. Attributes/context policies can complement RBAC.'],
['RBAC compared with DAC and MAC','DAC: resource owners grant user permissions—flexible sharing, but can spread inconsistently. MAC: centrally defined policy, often labels and clearances—strong consistent enforcement, less flexible. RBAC: permissions through role membership—fits organizational responsibilities, but roles may be broad or numerous. Example document: DAC owner grants colleague read; MAC checks clearance/classification; RBAC checks Project Analyst role.'],
['Enterprise IT examples','Workflow management: Requester submits purchase; Manager approves; Finance pays; Auditor reads. Constraints prevent incompatible steps by one person. UNIX: users, groups and read/write/execute bits are traditional controls; RBAC can add administrative roles activated only when needed. Java: application roles guard operations; Administrator manages accounts, Viewer reads reports; frameworks/application servers can support role checks.'],
['Exam-ready summary','RBAC assigns permissions to roles and roles to users. Core RBAC includes users, roles, permissions, sessions. Hierarchies enable inheritance. Static constraints restrict roles held; dynamic constraints restrict roles activated together. RBAC supports organizational policies and separation of duties but may cause role explosion, overbroad permissions, and maintenance difficulty.'] ],questions:['Explain how permissions reach a user in RBAC.','Distinguish core, hierarchical, and constrained RBAC.','Static vs dynamic separation of duties?','Compare RBAC with DAC and MAC.','Give two RBAC limitations.','How can RBAC support separation of duties in purchase approval?']}
,{short:'Smart Card Security',tag:'SMART CARDS',title:'Smart Card Security',sub:'Explore card operating systems, memory and files, identification, security testing, lifecycle, and terminals.',sections:[
['What is a smart card?','A smart card has an embedded chip that stores and processes data. A microprocessor card runs programs and enforces rules; a memory card mainly stores data with simpler access controls. Used for payment, identity, transport, telecom, and secure access. Security depends on card, software, reader/terminal, and connected systems.'],['Smart-card operating system','The card OS processes terminal commands; manages files and memory; checks permissions; runs applications and cryptographic functions; manages states such as initialization or blocked. Cards return responses to commands and have limited memory/compute.'],['Design and implementation principles','Smart-card software must work within limited memory and processing resources. Security should be enforced on the card; commands and file operations should validate permissions; sensitive keys should be protected; and errors should fail safely. Design for interoperability with supported standards and test the card together with terminals and applications.'],['Memory organization','ROM usually stores fixed core code; RAM is temporary working memory and usually lost when power is removed; EEPROM or flash is non-volatile, updateable memory for applications and user data. Memory aid: RAM temporary, ROM fixed, EEPROM/flash retained and updateable.'],['Files and management','MF (Master File) is root; DF (Dedicated File) groups application files; EF (Elementary File) stores data or records. OS controls select, read, update, delete operations. File selection and access checks prevent unauthorized cross-application access.'],['Security and user identification','PIN/secret proves knowledge; retry limits may block after failures. Cryptographic authentication can prove card/terminal identity. Secure messaging protects commands/responses from eavesdropping or tampering. Biometrics may be checked on card, terminal, or backend. Tamper-resistant design makes probing harder. Possession alone does not always prove the holder; another check may be needed.'],['Threats and defenses','Threats: physical probing/tampering; side-channel inference from power, timing, electromagnetic signals; software bugs/access-check bypass; communication interception, replay, modification; lost/stolen cards. Defenses: secure chip design, crypto protocols, access controls, retry limits, key management, testing, and reporting/blocking procedures. No single control makes a card invulnerable.'],['Quality assurance and testing','Physical tests check durability/environment; hardware tests chip and memory; software tests commands, files, permissions, errors; security evaluation checks authentication, cryptography, access controls; interoperability tests supported terminals. Testing reduces risk but cannot prove no flaw exists.'],['Five life-cycle phases','Common view: (1) Development—design chip, OS, apps, security. (2) Manufacturing—produce/test chip and card. (3) Pre-personalization/initialization—configure software, structure, issuer data. (4) Personalization and issuance—configure for user/application and deliver. (5) Use and end of life—use, maintain/block, deactivate/dispose securely. Names and boundaries vary by model. Protect design/keys in production, verify identity at issuance, protect in use, prevent residual data at retirement.'],['Protocol and Parameter Selection (PPS)','PPS is the negotiation step used after a smart card is activated to select supported communication protocol parameters between card and terminal. It helps the reader and card agree how to exchange data; it is a communication setup function, not itself a user authentication method.'],['Smart-card terminals','Terminal (payment reader, phone, access reader, computer reader) communicates with card, may provide power, exchange commands, and connect to larger systems. A secure card does not automatically make terminal or communication path secure; terminals also need protection and updates.'],['Exam-ready summary','Smart cards store data and may process commands or crypto. OS manages memory, files, apps, checks. Identification can use PIN, crypto, biometrics. Security addresses physical, software, communication attacks. QA tests hardware, software, durability, security. Protection spans design through end of life.'] ],questions:['Difference between ROM, RAM, EEPROM/flash?','What does a smart-card OS do?','How do PIN and crypto authentication help?','Why does security depend on the terminal too?','Name five lifecycle phases and security concerns.','Why can testing reduce risk without guaranteeing perfect security?']},
{short:'Cloud Data Security & Audit',tag:'CLOUD SECURITY',title:'Cloud Data Security & Audit',sub:'Review cloud database controls, audit practices, and secure key management from creation through retirement.',sections:[
['Cloud data security','Protect cloud data at rest (databases/backups/storage), in transit (between users/apps/services), and in use (being processed). Goals are confidentiality, integrity, availability. Challenges include remote access, shared infrastructure, many services, and divided provider/customer responsibilities. Encryption pairs with access control and key management.'],['Database security and access control','Allow only approved identities/actions. Controls: strong identity checks and MFA where appropriate; unique accounts; least privilege; role-based permissions; restricted network connectivity; separation of duties; encryption at rest and in transit; monitoring access, permission changes, unusual activity. Provider manages some infrastructure while customer configures users, permissions, protection, logs.'],['Recent database security trends','Fine-grained policies; centralized identity and temporary credentials to reduce long-lived secrets; encryption by default with choices about key control; continuous monitoring and alerts; automated checks for broad permissions, exposure, missing encryption; data minimization and masking in development/analytics/support. Effectiveness depends on configuration and review.'],['Cloud data audit','Structured review of control design, configuration, use, monitoring. Examine sensitive-data inventory/location; who can access it and why; encryption/key control; complete, protected, reviewed logs; backups/recovery/incident procedures; provider/customer responsibility split. Findings should lead to fixes, not just compliance.'],['Audit best practices','Inventory databases, storage, owners, sensitivity. Review permissions; remove unused accounts, stale roles, excess access. Enable logs; restrict modification/deletion and centralize where appropriate. Review unusual access, failed authentication, privilege changes, unexpected key use. Check protected backups and recovery. Track findings with owners, due dates, follow-up. Logs help only when protected and reviewed.'],['Key management','Keys control encryption/decryption. If stolen, data may be readable; if lost, data may be unrecoverable. Cover creation by trusted methods; protected storage (managed KMS/HSM where suitable; no hard-coded secrets); least-privilege use/admin; rotation; backup/recovery; revocation/deactivation; destruction; logging creation, use, access changes, deletion. Separate data/key permissions for defense in depth; logs must not expose key material.'],['Cloud Key Management Audit','Check key inventory/owners/data protected; restricted key use/admin; protection at rest/in transit; lifecycle rules for creation, rotation, disable, recovery, destruction; logged, protected, reviewed operations; secrets not exposed in code/config/deployment pipelines; recovery and separation of duties avoid unchecked control by one person.'],['Exam-ready summary','Cloud security protects data at rest, in transit, in use using access control, encryption, monitoring, recovery. Database controls include least privilege, identity checks, restricted connectivity, logs. Data audits check locations, permissions, encryption, logs, backups, responsibilities. Key management covers lifecycle; its audit checks access, logging, exposure, recovery.'] ],questions:['Difference between data at rest and in transit?','Name four cloud database controls.','What should a cloud data audit examine?','Why is encryption insufficient with weak key management?','What lifecycle activities should key management cover?','Why protect audit logs from changes?']}
];
const tabs=document.querySelector('#tabs');modules.forEach((m,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML=`<b>0${i+1}</b>${m.short}`;b.onclick=()=>render(i);tabs.append(b)});
const forms={'RBAC':'Role-Based Access Control','ABAC':'Attribute-Based Access Control','DAC':'Discretionary Access Control','MAC':'Mandatory Access Control','ACL':'Access-Control List','MF':'Master File','DF':'Dedicated File','EF':'Elementary File','ROM':'Read-Only Memory','RAM':'Random-Access Memory','EEPROM':'Electrically Erasable Programmable Read-Only Memory','OS':'Operating System','PIN':'Personal Identification Number','MFA':'Multi-Factor Authentication','KMS':'Key Management System','HSM':'Hardware Security Module','QA':'Quality Assurance','WFMSs':'Workflow Management Systems','WFMS':'Workflow Management System','PPS':'Protocol and Parameter Selection','UNIX':'UNIX (a multiuser operating system)'};
function expand(text){return text.replace(/\b(RBAC|ABAC|DAC|MAC|ACL|MF|DF|EF|ROM|RAM|EEPROM|OS|PIN|MFA|KMS|HSM|QA|UNIX)\b/g,(x)=>`${x} <small class="fullform">(${forms[x]})</small>`)}
function readable(text){const bits=text.split(/;\s+|(?<=\.) (?=[A-Z])/).filter(Boolean);const intro=bits.shift()||text;return `<div class="definition"><b>In brief</b><p>${expand(intro)}</p></div>${bits.length?`<ul class="readlist">${bits.map(x=>{const example=x.match(/^(Example:|Memory aid:|Memory aid\s*:)/);return `<li>${example?`<span class="example">${expand(x)}</span>`:expand(x)}</li>`}).join('')}</ul>`:''}`}
function render(i){const m=modules[i];document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('active',i===j));document.querySelector('#crumb').textContent=`Module ${i+1}`;document.querySelector('#eyebrow').textContent=`MODULE 0${i+1} · ${m.tag}`;document.querySelector('#title').textContent=m.title;document.querySelector('#subtitle').textContent=m.sub;document.querySelector('#counter').textContent=`${i+1} / 5`;document.querySelector('#progress').style.width=`${(i+1)*20}%`;document.querySelector('#content').innerHTML=`<div class="sectionhead"><h2>Study notes</h2><span>${m.sections.length} topics · Exam-focused</span></div><div class="grid">${m.sections.map((s,j)=>`<article class="card ${j===m.sections.length-1?'full':''}"><h3><i class="dot"></i>${expand(s[0])}</h3>${s.slice(1).map(p=>readable(p)).join('')}</article>`).join('')}<article class="card full"><h3><i class="dot"></i>Practice questions</h3>${m.questions.map((q,j)=>`<div class="q"><b>${j+1}.</b> ${expand(q)}</div>`).join('')}</article></div>`;}
render(0);
</script></body></html>
